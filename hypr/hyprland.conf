bind = SUPER SHIFT, S, exec, flameshot gui
monitor=,2560x1440@144hz,auto,1.6
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland

xwayland {
  force_zero_scaling = true
}


$terminal = kitty
$fileManager = nautilus
$browser = firefox

exec-once = swaybg -i $HOME/Wallpapers/wallpaper.png -m fill
exec-once = waybar

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

general {
    gaps_in = 4
    gaps_out = 5

    border_size = 2
    col.active_border = rgba(4b5d54ff)
    col.inactive_border = rgba(272d2aff)

    resize_on_border = false

    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 0
    rounding_power = 0

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = yes
        range = 7
        render_power = 6
        color = rgba(00000099)
    }

    blur {
        enabled = yes
        size = 8 
        passes = 2
        new_optimizations = true
        vibrancy = 1
    }
}

QT_QPA_PLATFORMTHEME=qt5ct
QT_STYLE_OVERRIDE=kvantum

animations {
    enabled = yes

bezier = quick, 0.2, 0, 0.1, 1
bezier = snap, 0.3, 1, 0.4, 1
bezier = bounce, 0.4, 1.2, 0.6, 1

animation = global,        1, 10, default
animation = border,        1, 6, quick
animation = windows,       1, 4, bounce
animation = windowsIn,     1, 3.5, bounce
animation = windowsOut,    1, 4, bounce

animation = fadeIn,        1, 0.25, quick
animation = fadeOut,       1, 0.2, quick
animation = fade,          1, 0.6, quick

animation = layers,        1, 2.8, snap
animation = layersIn,      1, 2.5, snap, slide
animation = layersOut,     1, 2.5, snap, slide
animation = fadeLayersIn,  1, 0.18, quick
animation = fadeLayersOut, 1, 0.15, quick

animation = workspaces,    1, 4, bounce, slide
animation = workspacesIn,  1, 4, bounce, slide
animation = workspacesOut, 1, 3, quick, slide

animation = zoomFactor,    1, 6, quick
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false  
}

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =


    repeat_rate = 35
    repeat_delay = 215
    accel_profile = flat

    follow_mouse = 1

    sensitivity = -0.7

    touchpad {
        natural_scroll = false
    }
}


device {
    name = epic-mouse-v1
    sensitivity = -0.5
}




# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
$mainMod = SUPER

bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod SHIFT, Q, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, L, exec, $browser
bind = $mainMod, F, fullscreen, 0


# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10


# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

#drun
bind = SUPER, D, exec, rofi -show drun


#AUDIO
bind = $mainMod SHIFT ALT, up, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = $mainMod SHIFT ALT, down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

#DISABLE WARNING
misc {
    disable_hyprland_guiutils_check = 1
}
